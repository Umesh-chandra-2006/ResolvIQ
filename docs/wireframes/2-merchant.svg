<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="'Segoe UI',system-ui,sans-serif">
  <style>
    .bg{fill:#f6f8fb}.frame{fill:#fff;stroke:#c3cbd6}.box{fill:#eef1f6;stroke:#c3cbd6}
    .rail{fill:#e7ecf2;stroke:#c3cbd6}.lbl{fill:#5b6673;font-size:13px}.lbl-sm{fill:#8a94a1;font-size:11px}
    .hd{fill:#39424e;font-size:16px;font-weight:600}.line{stroke:#cfd6de;stroke-width:6;stroke-linecap:round}
    .note{fill:#2f8a72;font-size:11px}.acc{fill:#d8ece6;stroke:#66b79f}.title{fill:#39424e;font-size:20px;font-weight:700}
    .chip{fill:#e9edf2;stroke:#c3cbd6}.warn{fill:#f6e6cf;stroke:#d29a4e}.mem{fill:#dbeaf2;stroke:#5ba9c9}.mer{fill:#f6e6cf;stroke:#d29a4e}
  </style>
  <rect class="bg" width="1200" height="820"/>
  <text class="title" x="40" y="42">Wireframe 2 — Merchant portal</text>
  <text class="lbl-sm" x="40" y="62">24h respond window with countdown · Case view showing the SAME timeline &amp; rubric the member sees</text>

  <rect class="frame" x="40" y="80" width="1120" height="700" rx="8"/>
  <rect class="rail" x="40" y="80" width="180" height="700"/>
  <rect class="box" x="60" y="100" width="140" height="34" rx="6"/><text class="lbl" x="74" y="122">◇ ResolvIQ</text>
  <rect class="box" x="60" y="150" width="140" height="28" rx="5"/><text class="lbl" x="74" y="169">Cardmember</text>
  <rect class="box" x="60" y="182" width="140" height="28" rx="5" fill="#dfe6ee" stroke="#9aa6b4"/><text class="lbl" x="74" y="201">Merchant</text>
  <rect class="box" x="60" y="214" width="140" height="28" rx="5"/><text class="lbl" x="74" y="233">Pipeline · Agent</text>
  <rect class="box" x="60" y="246" width="140" height="28" rx="5"/><text class="lbl" x="74" y="265">Audit · Ops</text>
  <rect class="box" x="220" y="80" width="940" height="40"/><rect class="chip" x="236" y="90" width="90" height="20" rx="4"/><text class="lbl-sm" x="246" y="104">DEMO DATA</text>

  <!-- respond window -->
  <text class="hd" x="244" y="150">Respond window · pre-adjudication</text>
  <rect class="box" x="244" y="164" width="430" height="200" rx="6"/>
  <rect class="warn" x="260" y="180" width="398" height="40" rx="6"/><text class="note" x="276" y="205" fill="#8a5b12">⏱ 18h 42m left to respond — D-2026-0850</text>
  <text class="lbl" x="260" y="248">Unrecognised charge · $76.20</text>
  <rect class="chip" x="260" y="264" width="190" height="40" rx="6"/><text class="lbl" x="288" y="288">Refund now</text>
  <rect class="acc" x="466" y="264" width="192" height="40" rx="6"/><text class="note" x="494" y="288">Contest with evidence</text>
  <text class="lbl-sm" x="260" y="336">Resolving here ≈ $20–30 vs</text>
  <text class="lbl-sm" x="260" y="352">$110–450 as a chargeback</text>

  <!-- case view symmetry -->
  <text class="hd" x="700" y="150">Case view — symmetric to member</text>
  <rect class="box" x="700" y="164" width="444" height="200" rx="6"/>
  <text class="lbl-sm" x="716" y="186">Same timeline · same rubric</text>
  <rect class="mer" x="716" y="196" width="130" height="70" rx="6"/><text class="lbl-sm" x="726" y="214">You submitted</text><line class="line" x1="726" y1="232" x2="836" y2="232"/><line class="line" x1="726" y1="248" x2="820" y2="248"/>
  <rect class="mem" x="854" y="196" width="130" height="70" rx="6"/><text class="lbl-sm" x="864" y="214">They submitted</text><line class="line" x1="864" y1="232" x2="974" y2="232"/><line class="line" x1="864" y1="248" x2="958" y2="248"/>
  <rect class="chip" x="992" y="196" width="136" height="70" rx="6"/><text class="lbl-sm" x="1002" y="214">System gathered</text><line class="line" x1="1002" y1="232" x2="1112" y2="232"/><line class="line" x1="1002" y1="248" x2="1096" y2="248"/>
  <text class="note" x="716" y="300">Symmetry is the stated design principle — both parties see the same evidence &amp; weighing</text>

  <!-- shared balance preview -->
  <text class="hd" x="244" y="410">Shared rubric — evidence balance (read-only for merchant)</text>
  <rect class="box" x="244" y="424" width="884" height="120" rx="6"/>
  <rect class="mer" x="300" y="470" width="260" height="28" rx="6"/><rect class="mem" x="580" y="470" width="300" height="28" rx="6"/>
  <line x1="570" y1="452" x2="570" y2="516" stroke="#39424e" stroke-width="2"/>
  <text class="lbl-sm" x="300" y="462">◄ merchant contributions</text><text class="lbl-sm" x="790" y="462">member contributions ►</text>

  <text class="note" x="244" y="580">Callouts: countdown live · economics line shown · identical timeline/rubric across both portals</text>
  <text class="lbl-sm" x="40" y="808">Low-fidelity wireframe · ResolvIQ Round 1</text>
</svg>

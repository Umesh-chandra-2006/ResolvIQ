<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="'Segoe UI',system-ui,sans-serif">
  <style>
    .bg{fill:#f6f8fb}.frame{fill:#fff;stroke:#c3cbd6}.box{fill:#eef1f6;stroke:#c3cbd6}
    .rail{fill:#e7ecf2;stroke:#c3cbd6}.lbl{fill:#5b6673;font-size:13px}.lbl-sm{fill:#8a94a1;font-size:11px}
    .hd{fill:#39424e;font-size:16px;font-weight:600}.line{stroke:#cfd6de;stroke-width:6;stroke-linecap:round}
    .note{fill:#2f8a72;font-size:11px}.acc{fill:#d8ece6;stroke:#66b79f}.title{fill:#39424e;font-size:20px;font-weight:700}
    .active{fill:#dfe6ee;stroke:#9aa6b4}.chip{fill:#e9edf2;stroke:#c3cbd6}
  </style>
  <rect class="bg" width="1200" height="820"/>
  <text class="title" x="40" y="42">Wireframe 1 — Card Member portal</text>
  <text class="lbl-sm" x="40" y="62">File a dispute (3 steps) · Case tracker with Reg Z clock · Decision view</text>

  <!-- app frame -->
  <rect class="frame" x="40" y="80" width="1120" height="700" rx="8"/>
  <!-- left rail -->
  <rect class="rail" x="40" y="80" width="180" height="700"/>
  <rect class="box" x="60" y="100" width="140" height="34" rx="6"/><text class="lbl" x="74" y="122">◇ ResolvIQ</text>
  <rect class="active" x="60" y="150" width="140" height="28" rx="5"/><text class="lbl" x="74" y="169">Cardmember</text>
  <rect class="box" x="60" y="182" width="140" height="28" rx="5"/><text class="lbl" x="74" y="201">Merchant</text>
  <rect class="box" x="60" y="214" width="140" height="28" rx="5"/><text class="lbl" x="74" y="233">Pipeline</text>
  <rect class="box" x="60" y="246" width="140" height="28" rx="5"/><text class="lbl" x="74" y="265">Agent</text>
  <rect class="box" x="60" y="278" width="140" height="28" rx="5"/><text class="lbl" x="74" y="297">Audit · Ops</text>
  <!-- top bar -->
  <rect class="box" x="220" y="80" width="940" height="40"/>
  <rect class="chip" x="236" y="90" width="90" height="20" rx="4"/><text class="lbl-sm" x="246" y="104">DEMO DATA</text>
  <rect class="chip" x="900" y="88" width="244" height="24" rx="5"/><text class="lbl-sm" x="912" y="104">View as: Cardmember | Merchant | Agent…</text>

  <!-- FILE A DISPUTE column -->
  <text class="hd" x="244" y="150">File a dispute</text>
  <rect class="box" x="244" y="164" width="430" height="150" rx="6"/>
  <text class="lbl-sm" x="260" y="186">Step 1 · Pick transaction</text>
  <rect class="chip" x="260" y="196" width="398" height="26" rx="4"/><text class="lbl" x="272" y="214">TXN-99821 · $184.50 · EATWELL</text>
  <text class="lbl-sm" x="260" y="244">Step 2 · Reason (plain language)</text>
  <rect class="chip" x="260" y="254" width="398" height="26" rx="4"/><text class="lbl" x="272" y="272">“I never received my order”  → C08</text>
  <text class="note" x="260" y="300">reason code mapped underneath (subtle)</text>

  <rect class="box" x="244" y="326" width="430" height="150" rx="6"/>
  <text class="lbl-sm" x="260" y="348">Step 3 · Describe + upload receipt</text>
  <line class="line" x1="262" y1="368" x2="640" y2="368"/><line class="line" x1="262" y1="386" x2="600" y2="386"/>
  <rect class="chip" x="260" y="404" width="180" height="40" rx="6"/><text class="lbl-sm" x="276" y="422">receipt.pdf</text><text class="note" x="276" y="437">OCR extracted ✓</text>
  <rect class="acc" x="520" y="440" width="140" height="30" rx="6"/><text class="note" x="548" y="459">Submit dispute</text>

  <!-- TRACKER + DECISION column -->
  <text class="hd" x="700" y="150">Case tracker</text>
  <rect class="box" x="700" y="164" width="444" height="180" rx="6"/>
  <text class="lbl-sm" x="716" y="186">Reg Z clock (12 CFR 1026.13)</text>
  <rect class="acc" x="716" y="196" width="412" height="30" rx="5"/><text class="note" x="728" y="215">Acknowledged in 4s · statutory limit 30 days</text>
  <text class="lbl-sm" x="716" y="248">Timeline</text>
  <circle cx="726" cy="268" r="5" fill="#66b79f"/><text class="lbl" x="742" y="272">Filed → Evidence gathered → Scored</text>
  <circle cx="726" cy="292" r="5" fill="#66b79f"/><text class="lbl" x="742" y="296">Decision issued</text>
  <text class="lbl-sm" x="716" y="326">Resolve by 2026-10-23 — 2 cycles, max 90 days</text>

  <text class="hd" x="700" y="374">Decision view</text>
  <rect class="box" x="700" y="388" width="444" height="180" rx="6"/>
  <rect class="acc" x="716" y="404" width="180" height="34" rx="6"/><text class="note" x="732" y="426">✓ Resolved · Cardmember</text>
  <text class="lbl" x="716" y="462">Plain-language narration with</text>
  <text class="lbl" x="716" y="482">inline evidence chips:</text>
  <rect class="chip" x="716" y="494" width="44" height="22" rx="11"/><text class="lbl-sm" x="726" y="509">E-1</text>
  <rect class="chip" x="768" y="494" width="44" height="22" rx="11"/><text class="lbl-sm" x="778" y="509">E-3</text>
  <rect class="chip" x="1000" y="530" width="128" height="28" rx="6"/><text class="lbl-sm" x="1016" y="549">Appeal (7 days)</text>

  <text class="note" x="244" y="520">Callouts: reason-code mapping shown subtly · Reg Z dates computed, not typed · evidence chips open the source item</text>
  <text class="lbl-sm" x="40" y="808">Low-fidelity wireframe · ResolvIQ Round 1</text>
</svg>
